name: Build MP SCAN APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-mp-scan-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-app
        run: gradle :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p downloads
          cp android-app/app/build/outputs/apk/debug/app-debug.apk mp-scan.apk
          cp mp-scan.apk downloads/mp-scan.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mp-scan-apk
          path: mp-scan.apk
          if-no-files-found: error

      - name: Publish APK in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/mp-scan.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Update downloadable MP SCAN APK"
            git push origin main
          fi
