name: Build MP SCAN Native Preview

on:
  workflow_dispatch:
  push:
    branches: [ main, app-mp-scan-desenvolvimento ]
    paths:
      - 'android-native/**'
      - '.github/workflows/build-mp-scan-native.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build native preview
        working-directory: android-native
        run: gradle :app:assembleDebug
      - name: Prepare preview APK
        run: |
          mkdir -p downloads
          cp android-native/app/build/outputs/apk/debug/app-debug.apk downloads/mp-scan-native-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mp-scan-native-preview
          path: downloads/mp-scan-native-preview.apk
          if-no-files-found: error
