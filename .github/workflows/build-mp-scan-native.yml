name: Build and validate MP SCAN release
on:
  pull_request:
    branches: [app-mp-scan-desenvolvimento]
    paths: ['android-native/**', '.github/workflows/build-mp-scan-native.yml']
  push:
    branches: [app-mp-scan-desenvolvimento, fix/app-design-offline]
    paths: ['android-native/**', '.github/workflows/build-mp-scan-native.yml']
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Compile and test release
        working-directory: android-native
        run: gradle :app:testDebugUnitTest :app:assembleRelease :app:assembleDebugAndroidTest --stacktrace
      - name: Enable emulator acceleration
        run: |
          sudo chmod 666 /dev/kvm
      - name: Verify long images and offline reading on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          working-directory: android-native
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            gradle :app:connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Android/data/online.mpscan.app/files/ui-checks app/build/outputs/ui-checks
      - name: Prepare unsigned release and signing tool
        run: |
          mkdir -p release-output
          cp android-native/app/build/outputs/apk/release/app-release-unsigned.apk release-output/MP-SCAN-release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release-output/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: mp-scan-release-unsigned
          path: release-output
          if-no-files-found: error
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          path: |
            android-native/app/build/reports/tests
            android-native/app/build/reports/androidTests
            android-native/app/build/outputs/androidTest-results
            android-native/app/build/outputs/ui-checks
