name: iOS — build e testes
on:
  push:
    branches: ['codex/ios-native-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ios/build
            ios/Core/.build
          key: ${{ runner.os }}-mpscan-ios-${{ hashFiles('ios/Core/Package.swift', 'ios/scripts/generate.py') }}
      - name: Testar modelos, novels e integridade offline
        working-directory: ios/Core
        run: swift test
      - name: Preparar configuração de teste
        working-directory: ios
        run: |
          cp App/GoogleService-Info.example.plist App/GoogleService-Info.plist
          brew install xcodegen
          python3 scripts/generate.py
      - name: Compilar e testar no simulador de iPhone
        working-directory: ios
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          xcodebuild test -project MPSCAN.xcodeproj -scheme MPSCAN -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build -resultBundlePath TestResults-iPhone.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Testar no simulador de iPad
        working-directory: ios
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPad" in x["name"]))')
          xcodebuild test -project MPSCAN.xcodeproj -scheme MPSCAN -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build -resultBundlePath TestResults-iPad.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Compilar pacote para iPhone físico — assinatura pessoal pendente
        working-directory: ios
        run: |
          xcodebuild build -project MPSCAN.xcodeproj -scheme MPSCAN -configuration Release -destination 'generic/platform=iOS' -derivedDataPath device-build CODE_SIGNING_ALLOWED=NO
          mkdir -p Package/Payload
          ditto device-build/Build/Products/Release-iphoneos/MPSCAN.app Package/Payload/MPSCAN.app
          cd Package
          zip -qry ../MP-SCAN-iOS-0.1.1-sem-assinatura.ipa Payload
      - name: Exportar capturas dos testes
        if: always()
        working-directory: ios
        run: |
          mkdir -p Capturas
          for DEVICE in iPhone iPad; do
            if [ -d "TestResults-$DEVICE.xcresult" ]; then
              xcrun xcresulttool export attachments --path "TestResults-$DEVICE.xcresult" --output-path "Capturas/$DEVICE" || true
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-test-results
          path: |
            ios/TestResults-*.xcresult
            ios/Capturas
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-device-unsigned
          path: ios/MP-SCAN-iOS-0.1.1-sem-assinatura.ipa
          if-no-files-found: error

      - uses: actions/cache/save@v4
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ios/build
            ios/Core/.build
          key: ${{ steps.cache.outputs.cache-primary-key }}
