name: iOS — build e testes
on:
  push:
    branches: ['codex/ios-native-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Testar modelos, novels e integridade offline
        working-directory: ios/Core
        run: swift test
      - name: Preparar configuração de teste
        working-directory: ios
        run: |
          cp App/GoogleService-Info.example.plist App/GoogleService-Info.plist
          brew install xcodegen
          python3 scripts/generate.py
      - name: Compilar e testar no simulador de iPhone
        working-directory: ios
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          xcodebuild test -project MPSCAN.xcodeproj -scheme MPSCAN -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-test-results
          path: ios/TestResults.xcresult
