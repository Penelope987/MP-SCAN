<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MP SCAN</title><style>
:root{--bg:#09070d;--card:#17101e;--line:#362641;--muted:#ad9bb8;--p:#8750c1;--pink:#d454a4}*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 90% 0,#352046,transparent 34%),var(--bg);color:#fff;font-family:system-ui,-apple-system,sans-serif}body{padding:env(safe-area-inset-top) 0 104px}.shell{width:min(900px,100%);margin:auto;padding:16px}.top{display:flex;align-items:center;gap:11px;margin-bottom:18px}.logo{width:47px;height:47px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,var(--p),var(--pink));font-weight:1000}.brand{flex:1}.brand b,.brand small{display:block}.brand small,.muted,small{color:var(--muted)}button{color:#fff}.round{width:42px;height:42px;border-radius:14px;background:#18111f;border:1px solid var(--line)}.hero{position:relative;min-height:350px;border-radius:28px;overflow:hidden;background:#24152d;border:1px solid #493057}.hero>img{position:absolute;width:100%;height:100%;object-fit:cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0d0910f2,#100b1290 65%,#100b1222),linear-gradient(0deg,#100a14d9,transparent 65%)}.herocopy{position:relative;z-index:1;width:min(600px,94%);padding:42px 28px}.eyebrow{color:#ddb9f3;font-size:10px;font-weight:950;letter-spacing:1.5px}.hero h1{font-size:clamp(28px,7vw,46px);line-height:1.03;margin:12px 0}.hero p{color:#cbbdd1;font-size:13px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.tags,.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.tag{padding:6px 9px;border-radius:999px;background:#ffffff16;border:1px solid #ffffff22;font-size:9px;font-weight:850}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:43px;padding:0 16px;border-radius:14px;text-decoration:none;color:#fff;font-size:12px;font-weight:900;background:#ffffff13;border:1px solid #ffffff22}.btn.main{background:linear-gradient(135deg,var(--p),var(--pink));border:0}.section{margin-top:28px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:13px}.head h2{font-size:19px;margin:0}.head p{margin:3px 0 0;font-size:10px;color:var(--muted)}.rail{display:grid;grid-auto-flow:column;grid-auto-columns:145px;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}.card{color:#fff;text-decoration:none;min-width:0}.poster{position:relative;aspect-ratio:2/3;border-radius:18px;overflow:hidden;background:linear-gradient(145deg,#56316e,#a34283);border:1px solid #ffffff15}.poster img{width:100%;height:100%;object-fit:cover}.rank{position:absolute;bottom:6px;left:8px;font-size:42px;line-height:1;font-weight:1000;text-shadow:0 4px 12px #000}.card h3{font-size:12px;margin:8px 2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.updates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.update{display:grid;grid-template-columns:64px 1fr;gap:11px;padding:10px;border-radius:18px;background:var(--card);border:1px solid var(--line);color:#fff;text-decoration:none}.update img{width:64px;height:86px;object-fit:cover;border-radius:12px}.update h3{font-size:12px;margin:6px 0}.update p{font-size:10px;color:#c7b4d0}.new{font-size:8px;padding:4px 6px;border-radius:999px;background:#9a3e84;font-weight:950}.search{position:sticky;top:0;z-index:4;width:100%;height:48px;border-radius:16px;border:1px solid var(--line);background:#17101eef;color:#fff;padding:0 15px;margin-bottom:18px;outline:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.detailhead{display:grid;grid-template-columns:125px 1fr;gap:17px}.detailhead .poster{width:125px}.detail h1{font-size:25px;margin:5px 0}.box{margin:18px 0;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:12px;color:#c7b7d0;line-height:1.6}.chapters{display:grid;gap:10px}.chapter{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);color:#fff;text-decoration:none}.num{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#2a1936;color:#e0bcf6;font-weight:950}.chapter span:nth-child(2){flex:1}.chapter b,.chapter small{display:block}.reader{width:min(1100px,100%);margin:auto}.readerbar{position:sticky;top:0;z-index:12;display:flex;gap:10px;align-items:center;background:#0b080feb;padding:11px 13px;border-bottom:1px solid var(--line)}.readerbar button{padding:9px 11px;border-radius:12px;background:#1d1425;border:1px solid var(--line)}.readertitle{flex:1;min-width:0}.readertitle b,.readertitle small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pages img{display:block;width:100%;height:auto}.empty,.loading{padding:44px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:22px}.empty b{display:block;color:#fff;font-size:17px;margin-bottom:7px}.bottom{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;width:min(620px,calc(100% - 20px));display:grid;grid-template-columns:repeat(4,1fr);padding:7px;border:1px solid #ffffff18;border-radius:23px;background:#120c19ef;backdrop-filter:blur(22px)}.bottom a{color:#918099;text-decoration:none;text-align:center;padding:8px 3px;border-radius:17px;font-size:9px;font-weight:850}.bottom i{display:block;font-style:normal;font-size:19px}.bottom a.on{color:#fff;background:linear-gradient(145deg,#713da5cc,#bd4994b8)}.hidden{display:none!important}@media(max-width:620px){.shell{padding:13px 12px}.updates{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.detailhead{grid-template-columns:98px 1fr}.detailhead .poster{width:98px}}
</style></head><body><div id="app"><main class="shell"><div class="loading">Carregando o MP SCAN…</div></main></div><nav class="bottom" id="nav"><a data-go="home"><i>⌂</i>Início</a><a href="mpscan-offline://library"><i>▦</i>Biblioteca</a><a data-go="catalog"><i>⌕</i>Busca</a><a data-go="more"><i>•••</i>Mais</a></nav><script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script><script>
(()=>{'use strict';const DB='https://nnnsss-23f2f-default-rtdb.firebaseio.com/',FC={apiKey:'AIzaSyAbpqQIxWuEnFolv3lNjNDoPKTGm0mtrxU',authDomain:'nnnsss-23f2f.firebaseapp.com',databaseURL:DB,projectId:'nnnsss-23f2f'},S={works:[],chapters:{},user:null,profile:null};const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),val=(o,...k)=>{for(const x of k)if(o&&o[x]!=null&&o[x]!=='')return o[x];return''},arr=v=>Array.isArray(v)?v:(v&&typeof v==='object'?Object.values(v):String(v||'').split(',').map(x=>x.trim()).filter(Boolean)),num=v=>Number(v)||0,name=w=>val(w,'nome','name')||'Sem nome',cover=w=>val(w,'capa','cover','coverURL'),banner=w=>val(w,'banner','bannerURL')||cover(w),cno=c=>val(c,'numero','number'),ctitle=c=>val(c,'titulo','title'),wlink=id=>'#work/'+encodeURIComponent(id),clink=(w,c)=>'#chapter/'+encodeURIComponent(w)+'/'+encodeURIComponent(c);
const header=s=>`<header class="top"><div class="logo">MP</div><div class="brand"><b>MP SCAN</b><small>${esc(s)}</small></div><button class="round" onclick="location.hash='more'">⚙</button></header>`,tags=w=>arr(val(w,'generos','genres')).slice(0,4).map(x=>`<span class="tag">${esc(x)}</span>`).join(''),card=(w,i='')=>`<a class="card" href="${wlink(w.id)}"><div class="poster">${cover(w)?`<img src="${esc(cover(w))}" alt="">`:''}${i?`<span class="rank">${i}</span>`:''}</div><h3>${esc(name(w))}</h3><small>${esc(val(w,'tipo','type')||'Obra')}</small></a>`;
const flag=v=>v===true||v===1||['true','1','sim','yes','on','ativo','ativado'].includes(String(v??'').toLowerCase()),statusLabel=v=>({ongoing:'Em andamento',complete:'Completa',paused:'Pausada',cancelled:'Cancelada',future:'Futura'}[String(v||'').toLowerCase()]||v||'Em andamento'),typeLabel=v=>({manga:'Mangá',manhwa:'Manhwa',manhua:'Manhua',novel:'Novel',webtoon:'Webtoon',oneshot:'One-shot',hq:'HQ',other:'Outro'}[String(v||'').toLowerCase()]||v||'Obra');
function pageValue(v){return typeof v==='string'?v.trim():String(val(v,'dataUrl','url','imagemUrl','imagem','src','page','base64','data')||'').trim()}function pagesFrom(raw){if(!raw)return[];if(typeof raw==='string')return raw.trim()?[raw.trim()]:[];return (Array.isArray(raw)?raw.map((v,i)=>[String(i),v]):Object.entries(raw)).map(([key,v],i)=>({url:pageValue(v),order:num(v&&typeof v==='object'?val(v,'ordem','order','index','posicao','position'):key)||i,i})).filter(x=>x.url).sort((a,b)=>a.order-b.order||a.i-b.i).map(x=>x.url)}
async function get(p){const r=await fetch(DB+p+'.json');if(!r.ok)throw Error(r.status);return await r.json()||{}}function normalize(){S.works=S.works.filter(w=>w.publicado!==false&&w.published!==false&&!flag(val(w,'maior18','adult')));Object.keys(S.chapters).forEach(id=>S.chapters[id]=S.chapters[id].filter(c=>c.publicado!==false&&c.published!==false).sort((a,b)=>num(cno(b))-num(cno(a))))}
function initSession(){try{const app=firebase.apps.length?firebase.app():firebase.initializeApp(FC),auth=firebase.auth(app),db=firebase.database(app);auth.onAuthStateChanged(async user=>{S.user=user&&!user.isAnonymous?user:null;S.profile=S.user?(await db.ref('usuarios/'+S.user.uid).once('value')).val()||{}:null;if((location.hash||'').startsWith('#more'))route()})}catch(e){console.warn('Sessão do MP SCAN indisponível',e)}}async function boot(){initSession();try{try{S.works=JSON.parse(localStorage.mpWorks||'[]');S.chapters=JSON.parse(localStorage.mpChapters||'{}');normalize();if(S.works.length)route()}catch(e){}const[w,c]=await Promise.all([get('obras'),get('capitulos')]);S.works=Object.entries(w).map(([id,x])=>({id,...x}));S.chapters=Object.fromEntries(Object.entries(c).map(([wid,g])=>[wid,Object.entries(g||{}).map(([id,x])=>({id,...x}))]));normalize();localStorage.mpWorks=JSON.stringify(S.works);localStorage.mpChapters=JSON.stringify(S.chapters);route()}catch(e){if(!S.works.length)$('#app').innerHTML=`<main class="shell">${header('Leitura offline')}<div class="empty"><b>Sem conexão agora</b>Abra sua Biblioteca para ver os capítulos baixados.</div></main>`}}
function home(){const hot=[...S.works].sort((a,b)=>num(val(b,'cliques','leituras','reads'))-num(val(a,'cliques','leituras','reads'))),f=hot[0]||S.works[0],recent=[...S.works].sort((a,b)=>num(val(b,'atualizadoEm','updatedAt'))-num(val(a,'atualizadoEm','updatedAt'))).slice(0,6);let hist=[];try{hist=JSON.parse(localStorage.mpHistory||'[]').map(x=>S.works.find(w=>w.id===x.workId)).filter(Boolean)}catch(e){}return `<main class="shell">${header('Histórias, capítulos e leitura offline')}${f?`<section class="hero">${banner(f)?`<img src="${esc(banner(f))}" alt="">`:''}<div class="herocopy"><div class="eyebrow">DESTAQUE MP SCAN</div><h1>${esc(name(f))}</h1><div class="tags">${tags(f)}</div><p>${esc(val(f,'sinopse','synopsis')||'Descubra esta obra no aplicativo.')}</p><div class="actions"><a class="btn main" href="${wlink(f.id)}">Ver obra</a><a class="btn" href="#catalog">Explorar</a></div></div></section>`:''}<section class="section"><div class="head"><div><h2>🔥 Em alta</h2><p>As obras mais acessadas</p></div></div><div class="rail">${hot.slice(0,10).map((w,i)=>card(w,i+1)).join('')}</div></section>${hist.length?`<section class="section"><div class="head"><div><h2>Continuar lendo</h2><p>Volte para sua última obra</p></div></div><div class="rail">${hist.slice(0,8).map(w=>card(w)).join('')}</div></section>`:''}<section class="section"><div class="head"><div><h2>Atualizações recentes</h2><p>Capítulos que acabaram de chegar</p></div></div><div class="updates">${recent.map(w=>{const c=(S.chapters[w.id]||[])[0];return `<a class="update" href="${c?clink(w.id,c.id):wlink(w.id)}">${cover(w)?`<img src="${esc(cover(w))}" alt="">`:''}<div><span class="new">NOVO</span><h3>${esc(name(w))}</h3><p>${c?'Capítulo '+esc(cno(c)):'Ver capítulos'}</p><small>${esc(val(w,'tipo','type'))}</small></div></a>`}).join('')}</div></section></main>`}
function catalog(){return `<main class="shell">${header('Todas as obras disponíveis')}<input id="search" class="search" placeholder="Buscar nome, gênero ou autor…"><div class="head"><div><h2>Buscar obras</h2><p id="count">${S.works.length} obras</p></div></div><div class="grid" id="grid">${S.works.map(w=>card(w)).join('')}</div></main>`}
function work(id){const w=S.works.find(x=>x.id===id);if(!w)return home();const cs=S.chapters[id]||[];return `<main class="shell detail">${header('Detalhes da obra')}<button class="round" onclick="history.back()">←</button><section class="section detailhead"><div class="poster">${cover(w)?`<img src="${esc(cover(w))}">`:''}</div><div><div class="eyebrow">${esc(typeLabel(val(w,'tipo','type')))}</div><h1>${esc(name(w))}</h1><small>${esc(val(w,'nomeAlternativo','altName'))}</small><div class="tags">${tags(w)}</div><small>${esc(statusLabel(val(w,'status')))}</small></div></section><div class="box">${esc(val(w,'sinopse','synopsis')||'Sinopse ainda não informada.')}</div><div class="actions"><a class="btn main" href="https://www.mpscan.online/#/obra/${encodeURIComponent(id)}">💬 Comentários e conta</a></div><section class="section"><div class="head"><div><h2>Capítulos</h2><p>${cs.length} disponíveis</p></div></div><div class="chapters">${cs.map(c=>`<div class="chapter"><a style="display:flex;align-items:center;gap:12px;flex:1;color:#fff;text-decoration:none" href="${clink(id,c.id)}"><span class="num">${esc(cno(c)||'—')}</span><span><b>Capítulo ${esc(cno(c)||'—')}</b><small>${esc(ctitle(c)||'Toque para ler')}</small></span></a><button class="round" title="Baixar capítulo" onclick="downloadListed('${esc(id)}','${esc(c.id)}',this)">↓</button></div>`).join('')||'<div class="empty">Nenhum capítulo publicado.</div>'}</div></section></main>`}
async function chapter(wid,cid){const w=S.works.find(x=>x.id===wid),cs=S.chapters[wid]||[],ix=cs.findIndex(x=>x.id===cid),c=cs[ix],prev=ix>=0?cs[ix+1]:null,next=ix>0?cs[ix-1]:null;if(!w||!c)return work(wid);$('#app').innerHTML='<div class="loading">Preparando o capítulo…</div>';try{const pages=pagesFrom(await get('capitulosPaginas/'+encodeURIComponent(wid)+'/'+encodeURIComponent(cid)));remember(wid,cid);window.reader={wid,cid,w,c,pages};const nav=`<nav style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:10px 12px;background:#0d0912">${prev?`<a class="btn" href="${clink(wid,prev.id)}">← Cap. ${esc(cno(prev)||'anterior')}</a>`:'<span></span>'}<a class="btn" href="${wlink(wid)}">☰ Obra</a>${next?`<a class="btn main" style="justify-self:end" href="${clink(wid,next.id)}">Cap. ${esc(cno(next)||'seguinte')} →</a>`:'<span></span>'}</nav>`;return `<div class="reader"><header class="readerbar"><button onclick="location.hash='work/${encodeURIComponent(wid)}'">←</button><div class="readertitle"><b>Capítulo ${esc(cno(c)||'—')}${ctitle(c)?' • '+esc(ctitle(c)):''}</b><small>${esc(name(w))} • ${pages.length} páginas</small></div><a class="btn" href="https://www.mpscan.online/#/capitulo/${encodeURIComponent(wid)}/${encodeURIComponent(cid)}">💬</a><button onclick="downloadCurrent()">↓</button></header>${nav}<main class="pages">${pages.map((p,i)=>`<img loading="${i<2?'eager':'lazy'}" src="${esc(p)}" alt="Página ${i+1}">`).join('')||'<div class="empty"><b>Capítulo sem imagens</b>Nenhuma página foi publicada ainda.</div>'}</main><section style="padding:28px 12px 42px;text-align:center;background:#0d0912"><b>Fim do capítulo ${esc(cno(c)||'')}</b><small style="display:block;margin:7px 0 16px;color:var(--muted)">${next?'Escolha o próximo capítulo ou volte para a obra.':'Você chegou ao capítulo mais recente.'}</small>${nav}</section></div>`}catch(e){return `<main class="shell"><div class="empty"><b>Não foi possível abrir</b>Confira sua conexão e tente novamente.</div></main>`}}
function remember(wid,cid){let h=[];try{h=JSON.parse(localStorage.mpHistory||'[]')}catch(e){}h=h.filter(x=>x.workId!==wid);h.unshift({workId:wid,chapterId:cid,at:Date.now()});localStorage.mpHistory=JSON.stringify(h.slice(0,30))}function sendDownload(d){if(!d||!d.pages.length){alert('Este capítulo não possui páginas para baixar.');return}const m={cover:cover(d.w),altName:val(d.w,'nomeAlternativo','altName'),synopsis:val(d.w,'sinopse','synopsis'),type:typeLabel(val(d.w,'tipo','type')),status:statusLabel(val(d.w,'status')),author:val(d.w,'autor','author'),artist:val(d.w,'artista','artist'),scan:val(d.w,'scan'),language:val(d.w,'idioma','language')};MPScanApp.downloadChapter(d.wid,d.cid,name(d.w),'Capítulo '+cno(d.c),ctitle(d.c),JSON.stringify(d.pages),JSON.stringify(m))}window.downloadCurrent=()=>sendDownload(window.reader);window.downloadListed=async(wid,cid,btn)=>{const w=S.works.find(x=>x.id===wid),c=(S.chapters[wid]||[]).find(x=>x.id===cid);if(!w||!c)return;const old=btn.textContent;btn.disabled=true;btn.textContent='…';try{sendDownload({wid,cid,w,c,pages:pagesFrom(await get('capitulosPaginas/'+encodeURIComponent(wid)+'/'+encodeURIComponent(cid)))})}catch(e){alert('Não foi possível preparar o download.')}finally{btn.disabled=false;btn.textContent=old}};
function more(){const logged=!!S.user,who=logged?esc(val(S.profile,'nome')||S.user.displayName||S.user.email||'Conta conectada'):'Visitante';return `<main class="shell">${header('Configurações do aplicativo')}<section class="hero" style="min-height:270px"><div class="herocopy"><div class="eyebrow">${logged?'CONTA CONECTADA':'MP SCAN'}</div><h1>${logged?'Olá, '+who:'Seu leitor, do seu jeito.'}</h1><p>${logged?'Sua sessão foi reconhecida. Os filtros de segurança da conta continuam ativos.':'Entre para comentar e sincronizar suas preferências.'}</p><div class="actions"><a class="btn main" href="https://www.mpscan.online/#/configuracoes/conta">${logged?'Conta e segurança':'Entrar ou criar conta'}</a><a class="btn" href="mpscan-offline://library">Downloads</a></div></div></section><section class="section"><div class="chapters"><a class="chapter" href="https://www.mpscan.online/#/configuracoes/maioridade"><span class="num">◷</span><span><b>Verificação etária</b><small>Consulte ou atualize o status etário da conta.</small></span><b>›</b></a><a class="chapter" href="https://www.mpscan.online/#/configuracoes/sensivel"><span class="num">◇</span><span><b>Conteúdo sensível</b><small>Gerenciado conforme a idade e as permissões da conta.</small></span><b>›</b></a><a class="chapter" href="mpscan-offline://notifications"><span class="num">🔔</span><span><b>Notificações</b><small>Permitir avisos do aplicativo.</small></span><b>›</b></a></div></section></main>`}
async function route(){const p=(location.hash||'#home').slice(1).split('/'),page=p[0]||'home';document.querySelectorAll('.bottom a').forEach(a=>a.classList.toggle('on',a.dataset.go===page));$('#nav').classList.toggle('hidden',page==='chapter');let html=page==='catalog'?catalog():page==='work'?work(decodeURIComponent(p[1]||'')):page==='chapter'?await chapter(decodeURIComponent(p[1]||''),decodeURIComponent(p[2]||'')):page==='more'?more():home();$('#app').innerHTML=html;scrollTo(0,0);if(page==='catalog')$('#search').oninput=e=>{const q=e.target.value.toLowerCase(),list=S.works.filter(w=>(name(w)+' '+val(w,'nomeAlternativo','altName')+' '+arr(val(w,'generos','genres')).join(' ')+' '+val(w,'autor','author')).toLowerCase().includes(q));$('#grid').innerHTML=list.map(w=>card(w)).join('');$('#count').textContent=list.length+' obras'}}document.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(a){e.preventDefault();location.hash=a.dataset.go}});addEventListener('hashchange',route);window.MPScanNativeUI={progress:m=>{},done:m=>alert(m),fail:m=>alert(m)};boot()})();
</script></body></html>
